id: T1566.001_asr_block_email_executable_content
name: "ASR — Block Executable Content from Email Client and Webmail"
mitre_technique: "T1566.001"
mitre_tactic: "initial_access"
description: >
  Tests the Microsoft Defender ASR rule "Block executable content from email client and
  webmail" (GUID be9ba2d9-53ea-4cdc-84e5-9b1eeee46550). Blocks executables/scripts saved
  from email (Outlook and webmail in a browser) from running. REQUIRES a mail client or
  webmail as the file origin — the rule keys on the email-client provenance, so a plain
  file drop does not reproduce it. This scenario reports the rule's mode and documents
  the trigger. Read docs/asr_testing.md first.
author: stanleytobias
created: "2026-07-08"
platform: windows
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference

steps:
  - step: 1
    type: marker
    description: "Context and requirement"
    message: "ASR test — Block executable content from email (be9ba2d9). REQUIRES email/webmail as the file origin. Documented trigger below. Lab VM only."

  - step: 2
    type: exec_powershell
    description: "ASR preflight — this rule's configured action"
    command: |
      $id = 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550'
      try { $mp = Get-MpComputerStatus; Write-Host "[PAS][ASR] AMRunningMode=$($mp.AMRunningMode) RTP=$($mp.RealTimeProtectionEnabled)" } catch {}
      $p = Get-MpPreference
      $ids = @($p.AttackSurfaceReductionRules_Ids) | ForEach-Object { "$_".ToLower() }
      $i = [array]::IndexOf($ids, $id)
      if ($i -ge 0) { $m=@{'0'='Disabled';'1'='Block';'2'='Audit';'6'='Warn'}; $a="$($p.AttackSurfaceReductionRules_Actions[$i])"; Write-Host "[PAS][ASR] Rule $id action: $a ($($m[$a]))" }
      else { Write-Host "[PAS][ASR] WARNING: rule $id NOT configured — set Audit or Block first." }

  - step: 3
    type: marker
    description: "Documented benign trigger (requires email/webmail)"
    message: "Trigger: email a benign .exe to yourself, save the attachment from Outlook (or download it from webmail in a browser), then run it. Executable content originating from email fires the rule."

  - step: 4
    type: marker
    description: "Post-execution prompt"
    message: "After running the saved email attachment, check Defender log + MDE for an email-executable-content ASR event (be9ba2d9)."

cleanup:
  - step: 1
    type: marker
    description: "Cleanup guidance"
    message: "Delete the saved attachment and test email you used for the trigger."

analyst_checklist:
  - "Defender event: Event ID 1121/1122 referencing GUID be9ba2d9-53ea-4cdc-84e5-9b1eeee46550"
  - "File event: executable saved from outlook.exe (or a browser downloading webmail content) then executed"
  - "MDE Advanced Hunting: DeviceEvents | where ActionType startswith 'Asr' and ActionType contains 'ExecutableEmailContent'"
  - "CONTROL CHECK: rule action from preflight — Audit yields 1122, Block yields 1121"
