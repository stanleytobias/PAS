id: T1106_asr_block_office_macro_win32_api
name: "ASR — Block Win32 API Calls from Office Macros"
mitre_technique: "T1106"
mitre_tactic: "execution"
description: >
  Tests the Microsoft Defender ASR rule "Block Win32 API calls from Office macros"
  (GUID 92e97fa1-2edf-4476-bdd6-9dd0b4ddddc7b). Malicious VBA declares and calls Win32
  APIs (e.g., VirtualAlloc, CreateThread) to run shellcode without spawning a child.
  REQUIRES Microsoft Office and a macro with a Win32 API Declare. This scenario reports
  the rule's mode and documents the trigger. Read docs/asr_testing.md first.
author: stanleytobias
created: "2026-07-08"
platform: windows
references:
  - https://attack.mitre.org/techniques/T1106/
  - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference

steps:
  - step: 1
    type: marker
    description: "Context and requirement"
    message: "ASR test — Block Win32 API from Office macros (92e97fa1). REQUIRES Microsoft Office + a macro with a Win32 Declare. Documented trigger below. Lab VM only."

  - step: 2
    type: exec_powershell
    description: "ASR preflight — this rule's configured action"
    command: |
      $id = '92e97fa1-2edf-4476-bdd6-9dd0b4ddddc7b'
      try { $mp = Get-MpComputerStatus; Write-Host "[PAS][ASR] AMRunningMode=$($mp.AMRunningMode) RTP=$($mp.RealTimeProtectionEnabled)" } catch {}
      $p = Get-MpPreference
      $ids = @($p.AttackSurfaceReductionRules_Ids) | ForEach-Object { "$_".ToLower() }
      $i = [array]::IndexOf($ids, $id)
      if ($i -ge 0) { $m=@{'0'='Disabled';'1'='Block';'2'='Audit';'6'='Warn'}; $a="$($p.AttackSurfaceReductionRules_Actions[$i])"; Write-Host "[PAS][ASR] Rule $id action: $a ($($m[$a]))" }
      else { Write-Host "[PAS][ASR] WARNING: rule $id NOT configured — set Audit or Block first." }

  - step: 3
    type: marker
    description: "Documented benign trigger (requires Office)"
    message: "Trigger: a VBA macro with a Declare of a Win32 API (e.g., VirtualAlloc or CreateThread from kernel32) that calls it with benign arguments. The Win32 API call from the macro fires the rule."

  - step: 4
    type: marker
    description: "Post-execution prompt"
    message: "After running the macro, check Defender log + MDE for an Office-macro-Win32-API ASR event (92e97fa1)."

cleanup:
  - step: 1
    type: marker
    description: "Cleanup guidance"
    message: "Delete the macro document you created for the trigger."

analyst_checklist:
  - "Defender event: Event ID 1121/1122 referencing GUID 92e97fa1-2edf-4476-bdd6-9dd0b4ddddc7b"
  - "Behavioral: an Office app invoking Win32 memory/thread APIs from macro (VBA) context"
  - "MDE Advanced Hunting: DeviceEvents | where ActionType startswith 'Asr' and ActionType contains 'OfficeMacroWin32'"
  - "CONTROL CHECK: rule action from preflight — Audit yields 1122, Block yields 1121"
