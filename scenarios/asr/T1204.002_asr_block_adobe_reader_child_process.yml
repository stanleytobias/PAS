id: T1204.002_asr_block_adobe_reader_child_process
name: "ASR — Block Adobe Reader from Creating Child Processes"
mitre_technique: "T1204.002"
mitre_tactic: "execution"
description: >
  Tests the Microsoft Defender ASR rule "Block Adobe Reader from creating child
  processes" (GUID 7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c). Malicious PDFs abuse Adobe
  Reader to launch processes. REQUIRES Adobe Acrobat Reader. This scenario reports the
  rule's mode and documents the benign trigger. Read docs/asr_testing.md first.
author: stanleytobias
created: "2026-07-08"
platform: windows
references:
  - https://attack.mitre.org/techniques/T1204/002/
  - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference

steps:
  - step: 1
    type: marker
    description: "Context and requirement"
    message: "ASR test — Block Adobe Reader child process (7674ba52). REQUIRES Adobe Acrobat Reader. Documented trigger below. Lab VM only."

  - step: 2
    type: exec_powershell
    description: "ASR preflight — this rule's configured action"
    command: |
      $id = '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c'
      try { $mp = Get-MpComputerStatus; Write-Host "[PAS][ASR] AMRunningMode=$($mp.AMRunningMode) RTP=$($mp.RealTimeProtectionEnabled)" } catch {}
      $p = Get-MpPreference
      $ids = @($p.AttackSurfaceReductionRules_Ids) | ForEach-Object { "$_".ToLower() }
      $i = [array]::IndexOf($ids, $id)
      if ($i -ge 0) { $m=@{'0'='Disabled';'1'='Block';'2'='Audit';'6'='Warn'}; $a="$($p.AttackSurfaceReductionRules_Actions[$i])"; Write-Host "[PAS][ASR] Rule $id action: $a ($($m[$a]))" }
      else { Write-Host "[PAS][ASR] WARNING: rule $id NOT configured — set Audit or Block first." }

  - step: 3
    type: marker
    description: "Documented benign trigger (requires Adobe Reader)"
    message: "Trigger: open a PDF whose OpenAction / Launch action runs calc.exe in Adobe Acrobat Reader. AcroRd32.exe / Acrobat.exe spawning calc.exe fires the rule."

  - step: 4
    type: marker
    description: "Post-execution prompt"
    message: "After opening the crafted PDF, check Defender log + MDE for an Adobe-Reader-child-process ASR event (7674ba52)."

cleanup:
  - step: 1
    type: marker
    description: "Cleanup guidance"
    message: "Delete the crafted PDF you used for the trigger."

analyst_checklist:
  - "Defender event: Event ID 1121/1122 referencing GUID 7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c"
  - "Process event: AcroRd32.exe / Acrobat.exe as parent of calc.exe (or cmd/powershell)"
  - "MDE Advanced Hunting: DeviceEvents | where ActionType startswith 'Asr' and ActionType contains 'AdobeReaderChildProcess'"
  - "CONTROL CHECK: rule action from preflight — Audit yields 1122, Block yields 1121"
