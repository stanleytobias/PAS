id: T1003.001_asr_block_lsass_credential_theft
name: "ASR — Block Credential Stealing from LSASS"
mitre_technique: "T1003.001"
mitre_tactic: "credential_access"
description: >
  Tests the Microsoft Defender ASR rule "Block credential stealing from the Windows
  local security authority subsystem (lsass.exe)" (GUID
  9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2). Credential dumpers such as Mimikatz open a
  handle to lsass.exe requesting PROCESS_VM_READ so they can read credential memory.
  Defender's ASR rule inspects that handle request. This scenario reproduces ONLY the
  handle request — OpenProcess with PROCESS_VM_READ | PROCESS_QUERY_INFORMATION,
  followed immediately by CloseHandle. It performs NO memory read and NO MiniDump; the
  handle request alone is what the rule evaluates. In Audit mode the handle is granted
  and Defender logs Event ID 1122; in Block mode the handle is denied and Defender logs
  Event ID 1121. Requires Defender active + RTP (no cloud needed). Read docs/asr_testing.md.
author: stanleytobias
created: "2026-07-08"
platform: windows
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference

steps:
  - step: 1
    type: marker
    description: "Pre-execution context and safety note"
    message: "ASR test — Block LSASS credential theft (9e6c4e1f). SAFE: opens then immediately closes an lsass handle. NO memory read, NO dump. Lab VM only."

  - step: 2
    type: exec_powershell
    description: "ASR preflight — Defender running mode, RTP, and this rule's configured action"
    command: |
      $ruleId   = '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2'
      $ruleName = 'Block credential stealing from LSASS'
      Write-Host "[PAS][ASR] Preflight for: $ruleName"
      Write-Host "[PAS][ASR] Rule GUID: $ruleId"
      try {
          $mp = Get-MpComputerStatus
          Write-Host "[PAS][ASR] AMRunningMode=$($mp.AMRunningMode)  RealTimeProtection=$($mp.RealTimeProtectionEnabled)"
          if ($mp.AMRunningMode -ne 'Normal') {
              Write-Host "[PAS][ASR] WARNING: Defender is not the active AV (mode $($mp.AMRunningMode)) — ASR rules will NOT enforce."
          }
      } catch {
          Write-Host "[PAS][ASR] Get-MpComputerStatus unavailable: $_"
      }
      try {
          $pref = Get-MpPreference
          $ids  = @($pref.AttackSurfaceReductionRules_Ids)  | ForEach-Object { "$_".ToLower() }
          $acts = @($pref.AttackSurfaceReductionRules_Actions)
          $idx  = [array]::IndexOf($ids, $ruleId.ToLower())
          if ($idx -ge 0) {
              $map = @{ '0'='Disabled'; '1'='Block'; '2'='Audit'; '6'='Warn' }
              $a   = "$($acts[$idx])"
              Write-Host "[PAS][ASR] Configured action: $a ($($map[$a]))"
          } else {
              Write-Host "[PAS][ASR] WARNING: rule is NOT configured on this host. A non-block result is EXPECTED and does not mean the control failed. Set it to Audit or Block first (see docs/asr_testing.md)."
          }
      } catch {
          Write-Host "[PAS][ASR] Get-MpPreference unavailable: $_"
      }

  - step: 3
    type: exec_powershell
    description: "Trigger — OpenProcess on lsass.exe with PROCESS_VM_READ, then CloseHandle (no dump)"
    command: |
      Add-Type @"
      using System;
      using System.Runtime.InteropServices;
      public class PASAsrLsass {
          [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(
              uint access, bool inherit, uint pid);
          [DllImport("kernel32.dll", SetLastError=true)] public static extern bool CloseHandle(IntPtr h);
          public const uint PROCESS_VM_READ          = 0x0010;
          public const uint PROCESS_QUERY_INFORMATION = 0x0400;
      }
"@
      $lsass = Get-Process lsass -ErrorAction SilentlyContinue
      if (-not $lsass) { Write-Host "[PAS][ASR] Could not resolve lsass PID"; return }
      $access = [PASAsrLsass]::PROCESS_VM_READ -bor [PASAsrLsass]::PROCESS_QUERY_INFORMATION
      Write-Host "[PAS][ASR] Requesting handle to lsass (PID $($lsass.Id)) access=0x$("{0:X}" -f $access) (VM_READ|QUERY_INFORMATION) — this is the request the ASR rule inspects."
      $h = [PASAsrLsass]::OpenProcess($access, $false, [uint32]$lsass.Id)
      if ($h -ne [IntPtr]::Zero) {
          Write-Host "[PAS][ASR] Handle GRANTED. Consistent with AUDIT/Disabled — expect Event 1122 if audited. Closing immediately (no read, no dump)."
          [PASAsrLsass]::CloseHandle($h) | Out-Null
      } else {
          $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
          Write-Host "[PAS][ASR] Handle DENIED (Win32Error=$err). Consistent with a BLOCK — expect Event 1121."
      }

  - step: 4
    type: sleep
    description: "Allow the ASR event to flush"
    seconds: 5

  - step: 5
    type: exec_powershell
    description: "ASR postflight — tail Defender Operational log for 1121/1122 on this rule"
    command: |
      $ruleId = '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2'
      Write-Host "[PAS][ASR] Checking Microsoft-Windows-Windows Defender/Operational for ASR events (1121=Block, 1122=Audit) in the last 5 minutes..."
      try {
          $ev = Get-WinEvent -FilterHashtable @{
                    LogName   = 'Microsoft-Windows-Windows Defender/Operational'
                    Id        = 1121,1122
                    StartTime = (Get-Date).AddMinutes(-5)
                } -ErrorAction SilentlyContinue
          $mine = @($ev | Where-Object { $_.Message -match $ruleId })
          if ($mine.Count -gt 0) {
              foreach ($e in $mine | Select-Object -First 5) {
                  $kind = if ($e.Id -eq 1121) { 'BLOCKED (1121)' } else { 'AUDITED (1122)' }
                  Write-Host "[PAS][ASR] $kind at $($e.TimeCreated): $(($e.Message -split "`r?`n")[0])"
              }
          } else {
              Write-Host "[PAS][ASR] No 1121/1122 events for this GUID. Rule not enabled, behavior did not match, or events not yet flushed."
          }
      } catch {
          Write-Host "[PAS][ASR] Event query failed: $_"
      }

  - step: 6
    type: marker
    description: "Post-execution prompt"
    message: "Check Defender log + MDE — an LSASS credential-theft ASR event (1121 or 1122) for GUID 9e6c4e1f should be visible now."

cleanup:
  - step: 1
    type: marker
    description: "No cleanup required"
    message: "ASR LSASS test created no artifacts — the handle was closed immediately and no dump file was written."

analyst_checklist:
  - "Defender event: Microsoft-Windows-Windows Defender/Operational Event ID 1121 (block) or 1122 (audit) referencing GUID 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2"
  - "Process event: powershell.exe opening a handle to lsass.exe with PROCESS_VM_READ (0x0010) — the flagged access mask"
  - "MDE Advanced Hunting: DeviceEvents | where ActionType startswith 'Asr' and ActionType contains 'Lsass'"
  - "MDE Advanced Hunting (robust): DeviceEvents | where Timestamp > ago(1h) | where ActionType startswith 'Asr' | project Timestamp, ActionType, FileName, InitiatingProcessFileName"
  - "Correlation: this ASR rule complements LSA PPL and Credential Guard — verify which of the three actually stopped the read in Block mode"
  - "CONTROL CHECK: rule action from preflight — Audit yields 1122 (handle granted), Block yields 1121 (handle denied); Not Configured yields neither"
