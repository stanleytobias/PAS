id: T1055_asr_block_office_process_injection
name: "ASR — Block Office Applications from Injecting Code into Other Processes"
mitre_technique: "T1055"
mitre_tactic: "defense_evasion"
description: >
  Tests the Microsoft Defender ASR rule "Block Office applications from injecting code
  into other processes" (GUID 75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84). Macro malware
  injects shellcode into another process (VirtualAllocEx / WriteProcessMemory /
  CreateRemoteThread) to run outside the Office process. REQUIRES Microsoft Office and a
  macro that performs injection — there is no clean pure-PowerShell equivalent. This
  scenario reports the rule's mode and documents the trigger. Read docs/asr_testing.md.
author: stanleytobias
created: "2026-07-08"
platform: windows
references:
  - https://attack.mitre.org/techniques/T1055/
  - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference

steps:
  - step: 1
    type: marker
    description: "Context and requirement"
    message: "ASR test — Block Office process injection (75668c1f). REQUIRES Microsoft Office + an injecting macro. Documented trigger below. Lab VM only."

  - step: 2
    type: exec_powershell
    description: "ASR preflight — this rule's configured action"
    command: |
      $id = '75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84'
      try { $mp = Get-MpComputerStatus; Write-Host "[PAS][ASR] AMRunningMode=$($mp.AMRunningMode) RTP=$($mp.RealTimeProtectionEnabled)" } catch {}
      $p = Get-MpPreference
      $ids = @($p.AttackSurfaceReductionRules_Ids) | ForEach-Object { "$_".ToLower() }
      $i = [array]::IndexOf($ids, $id)
      if ($i -ge 0) { $m=@{'0'='Disabled';'1'='Block';'2'='Audit';'6'='Warn'}; $a="$($p.AttackSurfaceReductionRules_Actions[$i])"; Write-Host "[PAS][ASR] Rule $id action: $a ($($m[$a]))" }
      else { Write-Host "[PAS][ASR] WARNING: rule $id NOT configured — set Audit or Block first." }

  - step: 3
    type: marker
    description: "Documented benign trigger (requires Office)"
    message: "Trigger: a VBA macro that opens a handle to another process and injects (VirtualAllocEx, WriteProcessMemory, CreateRemoteThread) — a benign no-op payload is sufficient. Office injecting into another process fires the rule."

  - step: 4
    type: marker
    description: "Post-execution prompt"
    message: "After running the injecting macro, check Defender log + MDE for an Office-injection ASR event (75668c1f)."

cleanup:
  - step: 1
    type: marker
    description: "Cleanup guidance"
    message: "Delete the macro document you created for the trigger."

analyst_checklist:
  - "Defender event: Event ID 1121/1122 referencing GUID 75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84"
  - "Process event: an Office app opening a handle to / creating a remote thread in another process"
  - "MDE Advanced Hunting: DeviceEvents | where ActionType startswith 'Asr' and ActionType contains 'OfficeProcessInjection'"
  - "CONTROL CHECK: rule action from preflight — Audit yields 1122, Block yields 1121"
