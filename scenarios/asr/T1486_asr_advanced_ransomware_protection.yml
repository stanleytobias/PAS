id: T1486_asr_advanced_ransomware_protection
name: "ASR — Use Advanced Protection Against Ransomware"
mitre_technique: "T1486"
mitre_tactic: "impact"
description: >
  Documents the Microsoft Defender ASR rule "Use advanced protection against ransomware"
  (GUID c1db55ab-c21a-4637-bb3f-a12568109d35). This rule is a cloud/ML behavioral
  classifier — it evaluates file characteristics and process behavior against cloud
  intelligence to block ransomware-like activity. There is NO clean benign trigger: any
  faithful simulation would need to behave like ransomware (mass-encrypt files), which
  is not lab-safe. This is a marker/documentation scenario; it validates configuration
  and the cloud precondition. REQUIRES cloud-delivered protection. Read docs/asr_testing.md.
author: stanleytobias
created: "2026-07-08"
platform: windows
references:
  - https://attack.mitre.org/techniques/T1486/
  - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference

steps:
  - step: 1
    type: marker
    description: "Context — no safe simulation"
    message: "ASR rule — Advanced ransomware protection (c1db55ab). Cloud/ML behavioral; NO lab-safe benign trigger. Configuration + control validation only."

  - step: 2
    type: exec_powershell
    description: "ASR preflight — cloud protection and this rule's configured action"
    command: |
      $id = 'c1db55ab-c21a-4637-bb3f-a12568109d35'
      try { $mp = Get-MpComputerStatus; Write-Host "[PAS][ASR] AMRunningMode=$($mp.AMRunningMode) RTP=$($mp.RealTimeProtectionEnabled)" } catch {}
      try { $pp = Get-MpPreference; Write-Host "[PAS][ASR] CloudProtection MAPSReporting=$($pp.MAPSReporting) SubmitSamples=$($pp.SubmitSamplesConsent) (cloud is required for this rule)" } catch {}
      $p = Get-MpPreference
      $ids = @($p.AttackSurfaceReductionRules_Ids) | ForEach-Object { "$_".ToLower() }
      $i = [array]::IndexOf($ids, $id)
      if ($i -ge 0) { $m=@{'0'='Disabled';'1'='Block';'2'='Audit';'6'='Warn'}; $a="$($p.AttackSurfaceReductionRules_Actions[$i])"; Write-Host "[PAS][ASR] Rule $id action: $a ($($m[$a]))" }
      else { Write-Host "[PAS][ASR] WARNING: rule $id NOT configured — set Block (needs cloud protection)." }

  - step: 3
    type: marker
    description: "Control validation guidance"
    message: "CONTROL CHECK: this rule requires cloud-delivered protection (MAPS) and sample submission. Pair it with Controlled Folder Access and tested, offline backups. Do not attempt a real encryption run to test it."

  - step: 4
    type: marker
    description: "Post-execution prompt"
    message: "Confirm the rule is Block, MAPSReporting is not 0, and Controlled Folder Access is enabled as a complementary control."

cleanup:
  - step: 1
    type: marker
    description: "No cleanup required"
    message: "Marker/documentation scenario — no artifacts created."

analyst_checklist:
  - "Defender event: Event ID 1121/1122 referencing GUID c1db55ab-c21a-4637-bb3f-a12568109d35 (only on genuine ransomware-like behavior)"
  - "Precondition: cloud-delivered protection (MAPSReporting != 0) — the rule cannot function without it"
  - "MDE Advanced Hunting: DeviceEvents | where ActionType startswith 'Asr' and ActionType contains 'Ransomware'"
  - "CONTROL CHECK: complement with Controlled Folder Access, tamper protection, and validated offline backups"
