id: T1068_asr_block_vulnerable_signed_driver
name: "ASR — Block Abuse of Exploited Vulnerable Signed Drivers"
mitre_technique: "T1068"
mitre_tactic: "privilege_escalation"
description: >
  Documents the Microsoft Defender ASR rule "Block abuse of exploited vulnerable signed
  drivers" (GUID 56a863a9-875e-4185-98a7-b882c64b5ce9). Adversaries load a legitimately
  signed but vulnerable driver (BYOVD) to gain kernel-level code execution. There is NO
  safe benign simulation — loading a real vulnerable driver is dangerous and can crash
  or compromise the host. This is a marker/documentation scenario per PAS convention for
  un-simulatable techniques; it validates configuration and provides control guidance.
  Read docs/asr_testing.md first.
author: stanleytobias
created: "2026-07-08"
platform: windows
references:
  - https://attack.mitre.org/techniques/T1068/
  - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference

steps:
  - step: 1
    type: marker
    description: "Context — no safe simulation"
    message: "ASR rule — Block vulnerable signed drivers (56a863a9). NO safe benign trigger: do NOT load real vulnerable drivers. Configuration + control validation only."

  - step: 2
    type: exec_powershell
    description: "ASR preflight — this rule's configured action"
    command: |
      $id = '56a863a9-875e-4185-98a7-b882c64b5ce9'
      try { $mp = Get-MpComputerStatus; Write-Host "[PAS][ASR] AMRunningMode=$($mp.AMRunningMode) RTP=$($mp.RealTimeProtectionEnabled)" } catch {}
      $p = Get-MpPreference
      $ids = @($p.AttackSurfaceReductionRules_Ids) | ForEach-Object { "$_".ToLower() }
      $i = [array]::IndexOf($ids, $id)
      if ($i -ge 0) { $m=@{'0'='Disabled';'1'='Block';'2'='Audit';'6'='Warn'}; $a="$($p.AttackSurfaceReductionRules_Actions[$i])"; Write-Host "[PAS][ASR] Rule $id action: $a ($($m[$a]))" }
      else { Write-Host "[PAS][ASR] WARNING: rule $id NOT configured — enable it (Block) to prevent BYOVD." }

  - step: 3
    type: marker
    description: "Control validation guidance"
    message: "CONTROL CHECK: this rule complements the Microsoft Vulnerable Driver Blocklist (enable it) and HVCI / Memory Integrity. Validate all three are on. To test safely, use Microsoft's published blocklist rather than loading a live vulnerable driver."

  - step: 4
    type: marker
    description: "Post-execution prompt"
    message: "Confirm the rule is set to Block and the Vulnerable Driver Blocklist is enabled (MDE / Get-MpComputerStatus IsVirtualizationBasedSecurityEnabled)."

cleanup:
  - step: 1
    type: marker
    description: "No cleanup required"
    message: "Marker/documentation scenario — no artifacts created."

analyst_checklist:
  - "Defender event: Event ID 1121/1122 referencing GUID 56a863a9-875e-4185-98a7-b882c64b5ce9 (if a blocked driver load is ever observed in production)"
  - "MDE Advanced Hunting: DeviceEvents | where ActionType startswith 'Asr' and ActionType contains 'VulnerableSignedDriver'"
  - "CONTROL CHECK: Microsoft Vulnerable Driver Blocklist enabled (Windows Security > Device security > Core isolation), plus HVCI"
  - "CONTROL CHECK: rule set to Block — audit provides little value here since a real load is required to generate telemetry"
